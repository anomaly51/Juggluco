name: JugglucoViewer
options:
  bundleIdPrefix: app.juggluco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
targets:
  JugglucoViewer:
    type: application
    platform: iOS
    sources:
      - path: JugglucoViewer
        excludes:
          - Resources
      - path: JugglucoViewer/Resources/Assets.xcassets
        buildPhase: resources
      - path: JugglucoViewer/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: JugglucoViewer/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.juggluco.viewer
        PRODUCT_NAME: JugglucoViewer
        PRODUCT_MODULE_NAME: JugglucoViewer
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Juggluco Viewer
    scheme:
      testTargets:
        - JugglucoViewerTests
      gatherCoverageData: true
  JugglucoViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JugglucoViewerTests
    dependencies:
      - target: JugglucoViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.juggluco.viewer.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JugglucoViewer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JugglucoViewer"
        BUNDLE_LOADER: "$(TEST_HOST)"
