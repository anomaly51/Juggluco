name: Backend Harbor deployment

on:
  workflow_run:
    workflows: [Backend container CI]
    types: [completed]
    branches: [primary]

concurrency:
  group: backend-deploy-primary
  cancel-in-progress: true

permissions:
  contents: write

env:
  REGISTRY: harbor.internal.api-api-api.com
  IMAGE_NAME: harbor.internal.api-api-api.com/applications/juggluco
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish-and-deploy:
    name: Build in cluster and update GitOps
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'primary' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: juggluco-deploy
    timeout-minutes: 30
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Derive immutable image tag
        id: image
        shell: bash
        run: echo "tag=sha-${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up in-runner BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to cluster Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Check immutable image tag
        id: image-exists
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE_NAME:$IMAGE_TAG"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish combined backend and PWA image
        if: steps.image-exists.outputs.value != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Verify image in cluster Harbor
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null

      - name: Check whether this source commit is current
        id: current
        shell: bash
        run: |
          git fetch origin primary
          if [ "$(git rev-parse origin/primary)" = "$SOURCE_SHA" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "A newer primary commit will publish its own image"
          fi

      - name: Promote the tested chart to the deployment branch
        if: steps.current.outputs.value == 'true'
        shell: bash
        run: |
          if git fetch origin deploy; then
            git switch --force-create deploy FETCH_HEAD
          else
            git switch --orphan deploy
          fi
          git checkout --no-overlay "$SOURCE_SHA" -- deploy/kubernetes/chart

      - name: Update GitOps image tag
        if: steps.current.outputs.value == 'true'
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        with:
          cmd: yq --inplace '.image.tag = strenv(IMAGE_TAG)' deploy/kubernetes/chart/values.yaml

      - name: Commit the verified deployment
        if: steps.current.outputs.value == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          git diff --check
          git add deploy/kubernetes/chart
          git diff --cached --check
          if git diff --cached --quiet -- deploy/kubernetes/chart; then
            echo "GitOps already points to $IMAGE_TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore(deploy): $IMAGE_TAG"
          git push origin HEAD:deploy

      - name: Verify the deployed version over HTTPS
        if: steps.current.outputs.value == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.image.outputs.tag }}
          DEPLOYMENT_URL: https://juggluco-general1.api-api-api.com
        shell: bash
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent "$DEPLOYMENT_URL/v1/ready" 2>/dev/null || true)"
            if jq --exit-status --arg expected "$EXPECTED_VERSION" \
              '.status == "ok" and .database == "ok" and .auth_configured and .viewer_auth_configured and .ai_configured and .version == $expected' \
              <<<"$health" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/" >/dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/manifest.webmanifest" >/dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/sw.js" >/dev/null
