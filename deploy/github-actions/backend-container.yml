name: Backend container

on:
  push:
    branches: [primary]
    paths:
      - "backend/**"
      - "pwa/**"
      - ".dockerignore"
      - "deploy/github-actions/backend-container.yml"
      - ".github/workflows/backend-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml

      - name: Test and build React PWA
        working-directory: pwa
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

      - uses: docker/setup-buildx-action@v3

      - name: Smoke-test the bundled viewer image
        run: |
          docker build -f backend/Dockerfile -t juggluco-backend:smoke .
          container_id=$(docker run -d -p 127.0.0.1:8765:8765 juggluco-backend:smoke)
          trap 'docker rm -f "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/v1/health >/dev/null && break
            sleep 1
          done
          index=$(curl --fail --silent http://127.0.0.1:8765/viewer/)
          curl --fail --silent http://127.0.0.1:8765/viewer/manifest.webmanifest >/dev/null
          curl --fail --silent http://127.0.0.1:8765/viewer/sw.js >/dev/null
          asset=$(printf '%s' "$index" | grep -oE '/viewer/assets/[^" ]+\.js' | head -n 1)
          test -n "$asset"
          curl --fail --silent "http://127.0.0.1:8765$asset" >/dev/null

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/juggluco-backend:latest
            ghcr.io/${{ github.repository_owner }}/juggluco-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
