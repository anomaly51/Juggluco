apiVersion: v1
kind: ServiceAccount
metadata:
  name: juggluco
  labels:
    app.kubernetes.io/name: juggluco
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: juggluco
  labels:
    app.kubernetes.io/name: juggluco
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  method: kubernetes
  mount: {{ .Values.vault.authMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: juggluco
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: juggluco-env
  labels:
    app.kubernetes.io/name: juggluco
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: juggluco
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    create: true
    name: juggluco-env
    transformation:
      includes:
        - '^(JUGGLUCO_API_TOKEN|JUGGLUCO_VIEWER_TOKEN|OPENROUTER_API_KEY)$'
  rolloutRestartTargets:
    - kind: Deployment
      name: juggluco
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: juggluco-registry
  labels:
    app.kubernetes.io/name: juggluco
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    juggluco.dev/registry: {{ .Values.registry.server | quote }}
spec:
  vaultAuthRef: juggluco
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.registry.vaultPath }}
  refreshAfter: 1h
  destination:
    create: true
    name: juggluco-registry
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - .*
      templates:
        .dockerconfigjson:
          text: |
            {{ `{{- $registry := get .Annotations "juggluco.dev/registry" -}}` }}
            {{ `{{- $credentials := dict "username" (get .Secrets "username") "password" (get .Secrets "password") -}}` }}
            {{ `{{- dict "auths" (dict $registry $credentials) | mustToJson -}}` }}
  rolloutRestartTargets:
    - kind: Deployment
      name: juggluco
