{{- if .Values.forecastBootstrap.enabled }}
{{- $candidateVersion := .Values.forecastBootstrap.candidateVersion | default (printf "display-%s" .Values.image.tag) }}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,96}$" $candidateVersion) }}
{{- fail "forecastBootstrap.candidateVersion (or display-<image.tag>) must match [A-Za-z0-9._-]{1,96}" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: juggluco-forecast-bootstrap
  labels:
    app.kubernetes.io/name: juggluco
    app.kubernetes.io/component: forecast-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.forecastBootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.forecastBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: juggluco
        app.kubernetes.io/component: forecast-bootstrap
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: juggluco-registry
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forecast-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - scripts.forecast_admin
          args:
            - --database
            - {{ .Values.config.databasePath | quote }}
            - deploy-display
            - --candidate-version
            - {{ $candidateVersion | quote }}
            - --source-change-retries
            - {{ .Values.forecastBootstrap.sourceChangeRetries | quote }}
            - --retry-delay-seconds
            - {{ .Values.forecastBootstrap.retryDelaySeconds | quote }}
            - --require-activation
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: JUGGLUCO_DATABASE_PATH
              value: {{ .Values.config.databasePath | quote }}
          resources:
            {{- toYaml .Values.forecastBootstrap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: juggluco-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
{{- end }}
