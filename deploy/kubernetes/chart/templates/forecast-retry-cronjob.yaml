{{- if .Values.forecastRetry.enabled }}
{{- $releaseVersion := .Values.forecastRetry.releaseVersion | default .Values.image.tag }}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,66}$" $releaseVersion) }}
{{- fail "forecastRetry.releaseVersion (or image.tag) must match [A-Za-z0-9._-]{1,66}" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juggluco-forecast-retry
  labels:
    app.kubernetes.io/name: juggluco
    app.kubernetes.io/component: forecast-retry
spec:
  schedule: {{ .Values.forecastRetry.schedule | quote }}
  timeZone: {{ .Values.forecastRetry.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.forecastRetry.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.forecastRetry.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.forecastRetry.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.forecastRetry.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.forecastRetry.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.forecastRetry.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: juggluco
            app.kubernetes.io/component: forecast-retry
        spec:
          serviceAccountName: juggluco
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: juggluco-registry
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: forecast-retry
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python
                - -m
                - scripts.forecast_admin
              args:
                - --database
                - {{ .Values.config.databasePath | quote }}
                - retry-display-daily
                - --release-version
                - {{ $releaseVersion | quote }}
                - --source-change-retries
                - {{ .Values.forecastRetry.sourceChangeRetries | quote }}
                - --retry-delay-seconds
                - {{ .Values.forecastRetry.retryDelaySeconds | quote }}
              env:
                - name: APP_VERSION
                  value: {{ .Values.image.tag | quote }}
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: JUGGLUCO_DATABASE_PATH
                  value: {{ .Values.config.databasePath | quote }}
              resources:
                {{- toYaml .Values.forecastRetry.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: juggluco-data
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
{{- end }}
