replicas: 1
image:
  repository: harbor.internal.api-api-api.com/applications/juggluco
  tag: sha-2d435f834bed
  pullPolicy: IfNotPresent
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: juggluco
  path: apps/juggluco
  refreshAfter: 1m
route:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  hostname: juggluco-general1.api-api-api.com
persistence:
  storageClassName: local-path
  size: 2Gi
# One idempotent PostSync attempt per GitOps sync. A rejected/skipped candidate
# leaves the safe active model pinned and lets the application sync complete;
# the bounded daily retry below waits for more receipt-causal data. The version
# defaults to "display-<image.tag>".
forecastBootstrap:
  enabled: true
  candidateVersion: ""
  sourceChangeRetries: 2
  retryDelaySeconds: 2
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
# One attempt per immutable release and UTC day until that release has an active
# display champion. Gate rejection is a healthy outcome: the alert-disabled
# baseline remains pinned and the next attempt receives a new UTC-day version.
forecastRetry:
  enabled: true
  releaseVersion: ""
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 900
  sourceChangeRetries: 2
  retryDelaySeconds: 2
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 172800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
config:
  databasePath: /data/juggluco.db
  # Anyone with the PWA link can view glucose. Write/admin routes still require
  # the Android bearer token and are never covered by the public viewer policy.
  viewerPublic: true
  trustedProxyCidrs: 10.42.0.0/16
  openrouterAudioLanguage: ru
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
