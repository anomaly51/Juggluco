replicas: 1
image:
  repository: harbor.internal.api-api-api.com/applications/juggluco
  tag: sha-a483332c655d
  pullPolicy: IfNotPresent
registry:
  server: harbor.internal.api-api-api.com
  vaultPath: apps/registry
vault:
  mount: kv
  authMount: kubernetes
  role: juggluco
  path: apps/juggluco
  refreshAfter: 1m
route:
  gatewayName: public
  gatewayNamespace: networking
  gatewaySectionName: https
  hostname: juggluco-general1.api-api-api.com
persistence:
  storageClassName: local-path
  size: 2Gi
# One idempotent PostSync attempt per GitOps sync. A rejected/skipped candidate
# leaves the safe active model pinned and fails the hook so GitOps cannot claim
# the requested model activated. The version defaults to "display-<image.tag>";
# a new source-revision suffix is used after a prior terminal decision.
forecastBootstrap:
  enabled: true
  candidateVersion: ""
  sourceChangeRetries: 2
  retryDelaySeconds: 2
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
config:
  databasePath: /data/juggluco.db
  # Anyone with the PWA link can view glucose. Write/admin routes still require
  # the Android bearer token and are never covered by the public viewer policy.
  viewerPublic: true
  trustedProxyCidrs: 10.42.0.0/16
  openrouterAudioLanguage: ru
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
