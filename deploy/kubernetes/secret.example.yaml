apiVersion: v1
kind: Secret
metadata:
  name: juggluco-backend-secrets
  namespace: juggluco
type: Opaque
stringData:
  JUGGLUCO_API_TOKEN: replace-with-a-random-token-at-least-32-characters-long
  JUGGLUCO_VIEWER_TOKEN: replace-with-a-different-random-token-at-least-32-characters
  OPENROUTER_API_KEY: replace-with-a-new-openrouter-key
