[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "juggluco-intake-backend"
version = "0.1.0"
description = "Local-first intake event and OpenRouter analysis service for Juggluco"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pillow>=11.3,<13",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
