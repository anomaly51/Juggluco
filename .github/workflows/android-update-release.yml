name: Android update release

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-update-release
  cancel-in-progress: false

jobs:
  release:
    # Manual dispatch must select an existing immutable release tag, not primary.
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: android-updates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release inputs before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE_B64 }}
          CERT_SHA256: ${{ vars.ANDROID_UPDATE_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^android-v[0-9]+$ ]]
          test -n "$SIGNING_KEY" && test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          test -n "$SIGNING_LINEAGE"
          [[ "$CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::A release already exists for this tag; never overwrite shipped APKs."
            exit 1
          fi
          python -m unittest discover -s tools/android_updates -p 'test_*.py'
      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198" "cmake;4.1.2"
          # The upstream repo tracks a developer-local SDK path. Use the runner SDK.
          rm -f -- local.properties
      - name: Test and build the phone variant
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          code="${RELEASE_TAG#android-v}"
          bash ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            "-PjugglucoVersionCode=$code" "-PjugglucoVersionName=10.9.8.$code" \
            :Common:testMobileLibre3SiDexNogoogleDebugUnitTest
          bash ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            "-PjugglucoVersionCode=$code" "-PjugglucoVersionName=10.9.8.$code" \
            :Common:assembleMobileLibre3SiDexNogoogleDebug
      - name: Sign and verify the published APK
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_LINEAGE: ${{ secrets.ANDROID_SIGNING_LINEAGE_B64 }}
          CERT_SHA256: ${{ vars.ANDROID_UPDATE_CERT_SHA256 }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash tools/android_updates/sign_release.sh
      - name: Publish all assets atomically through a draft release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Android $RELEASE_TAG" --generate-notes \
            release/juggluco-arm64-v8a.apk release/android-updates.json release/source.tar.gz
          gh release edit "$RELEASE_TAG" --draft=false --latest

