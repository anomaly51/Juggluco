name: Backend container CI/CD

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]
  workflow_dispatch:

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/anomaly51/juggluco-backend

jobs:
  validate:
    name: Test and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.4

      - name: Validate production chart
        shell: bash
        run: |
          helm lint --strict deploy/kubernetes/chart
          helm template juggluco deploy/kubernetes/chart --namespace juggluco >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.19.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml

      - name: Install, typecheck, test, and build PWA
        working-directory: pwa
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

      - name: Build and smoke-test combined image
        shell: bash
        run: |
          docker build --file backend/Dockerfile --tag juggluco-backend:smoke .
          container_id="$(docker run --detach --publish 127.0.0.1:8765:8765 \
            --env JUGGLUCO_API_TOKEN=ci-api-token-00000000000000000000000000000000 \
            --env JUGGLUCO_VIEWER_TOKEN=ci-viewer-token-000000000000000000000000000000 \
            --env OPENROUTER_API_KEY=ci-openrouter-placeholder \
            juggluco-backend:smoke)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/v1/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          docker exec --interactive "$container_id" python - <<'PY'
          import re
          from urllib.request import urlopen

          base_url = "http://127.0.0.1:8765"

          def fetch(path: str) -> bytes:
              with urlopen(f"{base_url}{path}", timeout=5) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned {response.status}")
                  return response.read()

          index = fetch("/viewer/").decode("utf-8")
          fetch("/viewer/manifest.webmanifest")
          fetch("/viewer/sw.js")
          asset = re.search(r'/viewer/assets/[^" ]+\.js', index)
          if asset is None:
              raise RuntimeError("viewer index does not reference a JavaScript asset")
          fetch(asset.group(0))
          PY

  publish-and-deploy:
    name: Publish image and update GitOps
    if: >-
      github.ref == 'refs/heads/primary' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Derive immutable image tag
        id: image
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish combined backend and PWA image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=juggluco-backend
          cache-to: type=gha,mode=max,scope=juggluco-backend

      - name: Verify the image is publicly pullable
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          docker logout ghcr.io
          if ! docker pull "$IMAGE_NAME:$IMAGE_TAG"; then
            echo "::error::Set the GHCR package visibility to Public, then rerun this workflow"
            exit 1
          fi

      - name: Check whether this source commit is current
        id: current
        shell: bash
        run: |
          git fetch origin primary
          if [ "$(git rev-parse origin/primary)" = "$GITHUB_SHA" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "A newer primary commit will publish its own image"
          fi

      - name: Promote the tested chart to the deployment branch
        if: steps.current.outputs.value == 'true'
        shell: bash
        run: |
          if git fetch origin deploy; then
            git switch --force-create deploy FETCH_HEAD
          else
            git switch --orphan deploy
          fi
          git checkout --no-overlay "$GITHUB_SHA" -- deploy/kubernetes/chart

      - name: Update GitOps image tag
        if: steps.current.outputs.value == 'true'
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        with:
          cmd: yq --inplace '.image.tag = strenv(IMAGE_TAG)' deploy/kubernetes/chart/values.yaml

      - name: Commit the verified deployment
        if: steps.current.outputs.value == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          git diff --check
          git add deploy/kubernetes/chart
          git diff --cached --check
          if git diff --cached --quiet -- deploy/kubernetes/chart; then
            echo "GitOps already points to $IMAGE_TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore(deploy): $IMAGE_TAG"
          git push origin HEAD:deploy

      - name: Verify the deployed version over HTTPS
        if: steps.current.outputs.value == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.image.outputs.tag }}
          DEPLOYMENT_URL: https://juggluco-general1.api-api-api.com
        shell: bash
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent "$DEPLOYMENT_URL/v1/ready" 2>/dev/null || true)"
            if jq --exit-status --arg expected "$EXPECTED_VERSION" \
              '.status == "ok" and .database == "ok" and .auth_configured and .viewer_auth_configured and .ai_configured and .version == $expected' \
              <<<"$health" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/" >/dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/manifest.webmanifest" >/dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/viewer/sw.js" >/dev/null
