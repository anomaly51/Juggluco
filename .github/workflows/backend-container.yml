name: Backend container CI

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]
  workflow_dispatch:

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.4

      - name: Validate production chart
        shell: bash
        run: |
          helm lint --strict deploy/kubernetes/chart
          helm template juggluco deploy/kubernetes/chart --namespace juggluco >/dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.19.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml

      - name: Install, typecheck, test, and build PWA
        working-directory: pwa
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test:run
          pnpm build

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

      - name: Build and smoke-test combined image
        shell: bash
        run: |
          docker build --file backend/Dockerfile --tag juggluco-backend:smoke .
          container_id="$(docker run --detach --publish 127.0.0.1:8765:8765 \
            --env JUGGLUCO_API_TOKEN=ci-api-token-00000000000000000000000000000000 \
            --env JUGGLUCO_VIEWER_TOKEN=ci-viewer-token-000000000000000000000000000000 \
            --env OPENROUTER_API_KEY=ci-openrouter-placeholder \
            juggluco-backend:smoke)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/v1/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          docker exec --interactive "$container_id" python - <<'PY'
          import re
          from urllib.request import urlopen

          base_url = "http://127.0.0.1:8765"

          def fetch(path: str) -> bytes:
              with urlopen(f"{base_url}{path}", timeout=5) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned {response.status}")
                  return response.read()

          index = fetch("/viewer/").decode("utf-8")
          fetch("/viewer/manifest.webmanifest")
          fetch("/viewer/sw.js")
          asset = re.search(r'/viewer/assets/[^" ]+\.js', index)
          if asset is None:
              raise RuntimeError("viewer index does not reference a JavaScript asset")
          fetch(asset.group(0))
          PY
